<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFHN83 Marginal 測項 Wafer Heatmap</title>
<style>
:root{--bg:#0f1b2d;--panel:#16263d;--ink:#eaf0f8;--mute:#9db0c9;--ok:#4cc2a0;--ng:#f08a5d;--acc:#6aa8ff;--line:#26405f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
.slide{position:absolute;inset:0;padding:3.5vh 4vw 7vh;display:none;flex-direction:column;gap:1.6vh}
.slide.active{display:flex}
h1{font-size:clamp(28px,4.6vw,56px);line-height:1.2}
h2{font-size:clamp(20px,2.6vw,32px);border-left:6px solid var(--acc);padding-left:14px}
.sub{color:var(--mute);font-size:clamp(13px,1.5vw,19px)}
.note{color:var(--mute);font-size:clamp(11px,1.2vw,15px)}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:clamp(11px,1.2vw,15px);background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.ok{color:var(--ok)}.ng{color:var(--ng)}
.hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
ul{list-style:none;display:grid;gap:1.4vh;font-size:clamp(14px,1.8vw,23px)}
li::before{content:"▸ ";color:var(--acc)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2vw;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.2vh 1vw;display:flex;flex-direction:column;gap:.8vh;min-height:0}
.panel .t{font-weight:600;font-size:clamp(13px,1.5vw,18px)}
.panel .st{color:var(--mute);font-size:clamp(10px,1.1vw,14px)}
.cv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cv canvas{max-width:100%;max-height:100%;aspect-ratio:1/1;background:#0c1626;border-radius:8px}
.bar{position:relative;height:14px;border-radius:3px;margin:0 8%}
.ticks{position:relative;height:30px;margin:0 8%;font-size:clamp(10px,1.1vw,13px);color:var(--mute)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span::before{content:"";position:absolute;left:50%;top:-4px;height:5px;border-left:1px solid var(--mute)}
.ticks .lim{color:var(--ink)}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:clamp(10px,1.1vw,13px);color:var(--mute);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ring{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:transparent;border:2px solid}
.binleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:clamp(10px,1.1vw,13px);color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:clamp(11px,1.25vw,16px)}
th,td{padding:.6vh .8vw;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:500}
.nav{position:fixed;left:0;right:0;bottom:0;height:5vh;min-height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 2vw;color:var(--mute);font-size:13px;background:linear-gradient(transparent,#0a1322)}
.nav button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:3px 12px;cursor:pointer;margin-left:6px}
.prog{position:fixed;top:0;left:0;height:3px;background:var(--acc);transition:width .2s}
#tip{position:fixed;pointer-events:none;background:#0a1322ee;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;display:none;z-index:9;line-height:1.5;white-space:nowrap}
</style>
</head>

function stats(vals,lo,hi){const v=vals.filter(x=>x!==null);const med=pct(v,.5),sg=(pct(v,.75)-pct(v,.25))/1.349;
  const up=v.filter(x=>x>hi).length,dn=v.filter(x=>x<lo).length;
  const cpk=sg>0?Math.min((hi-med)/(3*sg),(med-lo)/(3*sg)):Infinity;return {n:v.length,med,sg,up,dn,cpk}}
function testSlide(t){
  const el=$(`<section class="slide"><div class="hdr"><h2>CP${t.cp}　${t.item}：${t.name}</h2><span class="tag">Limit ${t.lo} ~ ${t.hi}</span></div>
    <div class="pair">${['OK','NG'].map(k=>`<div class="panel"><div class="t"><span class="${k.toLowerCase()}">${WAF[k]} (${k})</span></div><div class="st" data-st="${k}"></div><div class="cv"><canvas data-k="${k}"></canvas></div></div>`).join('')}</div>
    <div><div class="bar" data-bar></div><div class="ticks" data-ticks></div></div>
    <div class="leg"><span><span class="ring" style="border-color:#ff2d95"></span>超過上限</span><span><span class="ring" style="border-color:#18e0ff"></span>低於下限</span><span><span class="sw" style="background:#33445c"></span>此測項無讀值（先前已 fail）</span><span class="note" data-rng></span></div></section>`);
  const allv=[...t.OK,...t.NG].map(a=>a[2]).filter(v=>v!==null);
  const st={OK:stats(t.OK.map(a=>a[2]),t.lo,t.hi),NG:stats(t.NG.map(a=>a[2]),t.lo,t.hi)};
  const maps={OK:new Map(t.OK.map(a=>[a[0]*1000+a[1],a[2]])),NG:new Map(t.NG.map(a=>[a[0]*1000+a[1],a[2]]))};
  el.draw=()=>{
    const vmin=mode==='spec'?t.lo:pct(allv,.02),vmax=mode==='spec'?t.hi:pct(allv,.98);
    el.querySelector('[data-bar]').style.background=gradCSS;
    const pos=v=>(v-vmin)/(vmax-vmin)*100;
    let tk=`<span style="left:0">${fmt(vmin,4)}</span><span style="left:100%">${fmt(vmax,4)}</span>`;
    if(mode==='data'){[['下限',t.lo],['上限',t.hi]].forEach(([n,v])=>{const p=pos(v);if(p>2&&p<98)tk+=`<span class="lim" style="left:${p}%">${n} ${v}</span>`});
      el.querySelector('[data-rng]').textContent='色階 = 兩片合計 P2~P98；超出規格範圍者以外框標示。限值若在色階外則不顯示刻度。'}
    else el.querySelector('[data-rng]').textContent='色階 = 規格下限 ~ 上限；顏色越偏暖代表越貼近上限。';
    el.querySelector('[data-ticks]').innerHTML=tk;
    el.querySelectorAll('canvas').forEach(cv=>{const k=cv.dataset.k;const [g,s]=setup(cv);
      for(const [x,y,v] of t[k]){
        if(v===null){cell(g,s,x,y,'#33445c');continue}
        const ring=v>t.hi?'#ff2d95':(v<t.lo?'#18e0ff':null);
        cell(g,s,x,y,color((v-vmin)/(vmax-vmin)),ring)}
      bindTip(cv,(x,y)=>{const kk=x*1000+y;if(!maps[k].has(kk))return null;const v=maps[k].get(kk);
        return `${WAF[k]} (${k}) 座標 (${x}, ${y})<br>Bin ${BL[t.cp][k].get(kk)}　${v===null?'<span style="color:#9db0c9">無讀值</span>':fmt(v,4)}`});
      const S=st[k];el.querySelector(`[data-st="${k}"]`).innerHTML=`n=${S.n}　中位數 ${fmt(S.med,4)}　Cpk ${S.cpk.toFixed(2)}　超規 ${S.up+S.dn}（↑${S.up} ↓${S.dn}）`});
  };
  return el}

// ---------- bin slide ----------
const BC={1:'#2d4f78',3:'#f2c14e',4:'#e07a5f',5:'#c77dff',6:'#4cc2a0',10:'#ff5d8f',12:'#9ad1d4',16:'#ffffff',17:'#ffa8ff',18:'#ff8c42',19:'#b5e48c',20:'#7ae582',32:'#ffd6a5',34:'#5eead4',36:'#f4f1de'};
function binSlide(cp){
  const bins={};for(const k of ['OK','NG'])DATA.bins[cp][k].forEach(a=>{(bins[a[2]]=bins[a[2]]||{OK:0,NG:0})[k]++});
  const order=Object.keys(bins).map(Number).sort((a,b)=>a-b);
  const el=$(`<section class="slide"><div class="hdr"><h2>CP${cp}　Bin Map</h2><span class="tag">Bin 1 = Pass（深藍）；其他 Bin 為 fail</span></div>
    <div class="pair">${['OK','NG'].map(k=>{const n=DATA.bins[cp][k].length,f=DATA.bins[cp][k].filter(a=>a[2]!==1).length;return `<div class="panel"><div class="t"><span class="${k.toLowerCase()}">${WAF[k]} (${k})</span></div><div class="st">${n} die　Fail ${f}（${(f/n*100).toFixed(2)}%）</div><div class="cv"><canvas data-k="${k}"></canvas></div></div>`}).join('')}</div>
    <div class="binleg">${order.map(b=>`<span><span class="sw" style="background:${BC[b]||'#ccc'}"></span>Bin ${b}：${bins[b].OK} / ${bins[b].NG}</span>`).join('')}</div>
    <div class="note">圖例數字 = OK / NG 的 die 數。X 向右、Y 向下，依檔案座標繪製，未做翻轉。</div></section>`);
  el.draw=()=>{el.querySelectorAll('canvas').forEach(cv=>{const k=cv.dataset.k;const [g,s]=setup(cv);
    DATA.bins[cp][k].forEach(([x,y,b])=>cell(g,s,x,y,BC[b]||'#ccc',b!==1?'#ffffff55':null));
    bindTip(cv,(x,y)=>{const b=BL[cp][k].get(x*1000+y);return b===undefined?null:`${WAF[k]} (${k}) 座標 (${x}, ${y})<br>Bin ${b}`})})};
  return el}

// ---------- static slides ----------
const S=[];
S.push($(`<section class="slide"><div style="margin-top:12vh"><span class="tag">CP Test Data Review</span></div>
  <h1>FFHN83-19D0 (OK) vs 25A4 (NG)<br>Marginal 測項 Wafer Heatmap</h1>
  <p class="sub">CP1 三個 marginal 測項，加上 CP2、CP3 下一梯的四個測項；OK 與 NG 並排</p>
  <p class="sub" style="margin-top:auto">滑鼠移到 die 上可看座標與讀值；右下角可切換色階</p></section>`));
S.push($(`<section class="slide"><h2>怎麼看這份簡報</h2>
  <ul>
    <li>先看三個 CP 的 Bin Map，再看 7 個測項的讀值 heatmap</li>
    <li>測項：CP1 的 Trim current（Cpk 約 0.8）、OSC Frequency（約 0.9）、Band Gap Reference（約 1.1）；CP2 的兩個 OITRIM current 與 CP3 的兩個 OSC Frequency（Cpk 約 1.5）</li>
    <li>色階有兩種：「資料範圍」看空間分佈的差異；「規格範圍」看離 limit 有多近</li>
    <li>OK、NG 用同一組色階，顏色可直接比較；超規 die 以粉紅（超上限）或青色（低於下限）外框標示</li>
  </ul>
  <p class="note">兩片是不同 wafer，座標網格相同（X ${XMIN}~${XMAX}、Y ${YMIN}~${YMAX}），但沒有逐 die 對位分析。</p></section>`));
[1,2,3].forEach(cp=>S.push(binSlide(cp)));
DATA.tests.forEach(t=>S.push(testSlide(t)));
S.push($(`<section class="slide"><h2>觀察與結論</h2>
  <table style="max-width:1100px">
    <tr><th>項目</th><th>OK</th><th>NG</th><th>說明</th></tr>
    <tr><td>CP1 fail die（非 Bin 1）</td><td>69</td><td>53</td><td>外圈（半徑&gt;0.8）佔比 42% / 40%，全片外圈佔 37%</td></tr>
    <tr><td>CP2 / CP3 fail die</td><td>6 / 9</td><td>5 / 7</td><td>數量太少，無法判讀分佈</td></tr>
    <tr><td>CP1 OSC Frequency 超規</td><td>26</td><td>18</td><td>外圈佔比 46% / 39%</td></tr>
    <tr><td>CP1 Band Gap Reference 超規</td><td>9</td><td>7</td><td>NG 7 顆中 3 顆在外圈，數量太少</td></tr>
    <tr><td>CP1 Trim current 超規</td><td>1</td><td>0</td><td>—</td></tr>
  </table>
  <ul style="font-size:clamp(13px,1.6vw,20px)">
    <li><b>7 個測項的讀值在 wafer 上都沒有明顯的空間圖樣</b>：由內到外四個環帶的中位數差距都在 0.4σ 以內，與半徑的相關係數絕對值 ≤ 0.07（與 Y 座標最大 0.14）</li>
    <li>4 個 Site 的中位數與超規數也接近，沒有單一 Site 偏移（已檢查 5 個代表測項）</li>
    <li>OK 與 NG 的圖樣一致，marginal 來自規格窗口本身很窄，不是 25A4 特有</li>
    <li>CP3 兩個 OSC Frequency 的 NG 中位數略高（1.055 vs 1.053，約 0.2σ），沒有超規，影響很小</li>
  </ul>
  <p class="note">半徑為座標正規化後的相對距離（中心 X=42、Y=58.5），僅供判斷內外圈。</p></section>`));
const deck=document.getElementById('deck');S.forEach(s=>deck.appendChild(s));
let i=0;
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('active',k===i));
  document.getElementById('pg').textContent=(i+1)+' / '+S.length;document.getElementById('prog').style.width=((i+1)/S.length*100)+'%';
  tip.style.display='none';location.hash=i+1;requestAnimationFrame(()=>{if(S[i].draw)S[i].draw()})}
document.getElementById('next').onclick=()=>show(i+1);document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('mode').onclick=e=>{mode=mode==='data'?'spec':'data';e.target.textContent='色階：'+(mode==='data'?'資料範圍':'規格範圍');if(S[i].draw)S[i].draw()};
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1)}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);else if(e.key==='f')document.getElementById('fs').click();else if(e.key==='m')document.getElementById('mode').click()});
addEventListener('resize',()=>{if(S[i].draw)S[i].draw()});
show((parseInt(location.hash.slice(1))||1)-1);
</script>
