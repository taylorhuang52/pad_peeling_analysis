<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100V Wafer Test Log Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#667085;--card:#fff;--bd:#d9dde5;--ac:#2563eb;--bad:#dc2626;--good:#16a34a;--ln:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--fg:#e6e9ef;--mut:#9aa4b5;--card:#1b212b;--bd:#323b4a;--ac:#6ea0ff;--bad:#f87171;--good:#4ade80;--ln:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--fg:#e6e9ef;--mut:#9aa4b5;--card:#1b212b;--bd:#323b4a;--ac:#6ea0ff;--bad:#f87171;--good:#4ade80;--ln:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
#drop{display:block;box-sizing:border-box;margin:0;border:2px dashed var(--bd);border-radius:10px;text-align:center;padding:22px;cursor:pointer;color:var(--mut)}
#drop.on{border-color:var(--ac);color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--bd);border-radius:16px;padding:2px 10px;cursor:pointer;user-select:none;font-size:12px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:4px 10px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sc{overflow-x:auto}
.grid{display:flex;flex-wrap:wrap;gap:12px}
.grid .card{margin:0}
canvas{display:block;max-width:100%}
svg{max-width:100%;height:auto;display:block}
svg text{fill:var(--mut);font-size:11px}
.bar{fill:var(--ac)}.bad{fill:var(--bad)}
.png{font-size:12px;padding:2px 8px;float:right;margin-left:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--bd);padding:3px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.mut{color:var(--mut);font-size:12px}
.leg{height:10px;width:220px;background:linear-gradient(90deg,hsl(240 75% 50%),hsl(180 75% 50%),hsl(120 75% 50%),hsl(60 75% 50%),hsl(0 75% 50%));border-radius:5px}
</style></head><body><main>
<h1>📊 100V Wafer Test Log Analyzer</h1>
<div class="card" style="padding:0"><label id="drop">拖曳 / 點擊選擇 log（.zip 或 .csv，可多選；自動略過重複的 *_1.csv）<input id="fi" type="file" multiple accept=".zip,.csv" hidden></label>
<div style="padding:0 12px 12px"><div id="chips" class="chips"></div><div id="info" class="mut" style="margin-top:6px"></div></div></div>
<div id="app" hidden>
<div class="tabs"><button data-t="heat">Heatmap</button><button data-t="hist">上下限 / 分布</button><button data-t="par">柏拉圖</button><button data-t="yld">良率趨勢</button>
<button id="all" title="把目前頁面所有圖拼成一張 PNG（Heatmap 為陣列排列）">⬇ 全部 PNG</button><select id="item"></select><select id="hm"><option value="c">次數</option><option value="d">機率密度</option></select><select id="gp"><option value="w">各片 (Wafer)</option><option value="l">各批 (Lot)</option><option value="c">各站別 (Load Board)</option></select></div>
<div id="out"></div></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>!isFinite(v)?'-':(Math.abs(v)>=1e4||(Math.abs(v)<.001&&v!==0))?v.toExponential(2):String(+v.toPrecision(4));
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.max(0,Math.round(p*(s.length-1))))]};
const sel=()=>W.filter(w=>w.on),lim=(v,s)=>(isFinite(v)&&Math.abs(v)!==99.999)?v:null;
let W=[],S={t:'heat',item:0};
function add(txt,fn){
 const L=txt.replace(/^\uFEFF/,'').split(/\r?\n/),i=L.findIndex(l=>l.startsWith('Serial#'));if(i<3)return;
 const hd={};L.slice(0,26).forEach(l=>{const k=l.indexOf(':');if(k>0)hd[l.slice(0,k).trim()]=l.slice(k+1).trim()});
 const sp=l=>l.split(',').slice(6),names=sp(L[i-3]),up=sp(L[i-2]).map(Number),lo=sp(L[i-1]).map(Number),rows=[];
 for(let k=i+1;k<L.length;k++){const f=L[k].split(',');if(f.length<7)continue;
  rows.push({x:+f[4],y:+f[5],bin:+f[2],v:names.map((_,j)=>f[6+j]===undefined||f[6+j]===''?NaN:+f[6+j])})}
 const id=hd['Wafer ID']||fn;if(W.some(w=>w.id===id&&w.fn===fn))return;
 W.push({id,fn,lot:hd['Lot ID']||'',cp:hd['Load Board No']||'',temp:hd['Temperature']||'',names,up,lo,rows,on:true});
}
async function load(files){
 for(const f of files){
  if(/\.zip$/i.test(f.name)){const z=await JSZip.loadAsync(f);
   for(const n of Object.keys(z.files)){const e=z.files[n];if(!e.dir&&/\.csv$/i.test(n)&&!/_1\.csv$/i.test(n))add(await e.async('string'),n)}}
  else if(/\.csv$/i.test(f.name)&&!/_1\.csv$/i.test(f.name))add(await f.text(),f.name);
 }
 W.sort((a,b)=>a.id.localeCompare(b.id));ui();
}
function ui(){
 if(!W.length){$('#info').textContent='找不到可解析的 log';return}
 $('#app').hidden=false;
 $('#chips').innerHTML=W.map((w,i)=>`<span class="chip ${w.on?'on':''}" data-i="${i}">${esc(w.id)}</span>`).join('')+'<span class="chip" data-a="1">全選/全不選</span>';
 const nz=W.reduce((s,w)=>s+w.rows.length,0);
 $('#info').textContent=`已載入 ${W.length} 片 wafer，共 ${nz} 顆 die，${W[0].names.length} 個測項`;
 const cur=$('#item').value;
 $('#item').innerHTML=(S.t==='heat'?'<option value="-1">Bin Map</option>':'')+W[0].names.map((n,j)=>`<option value="${j}">${esc(n)}</option>`).join('');
 $('#item').value=S.item<0&&S.t!=='heat'?0:S.item;if($('#item').selectedIndex<0)$('#item').value=0;S.item=+$('#item').value;
 document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===S.t));
 $('#item').style.display=S.t==='par'||S.t==='yld'?'none':'';$('#hm').style.display=S.t==='hist'?'':'none';$('#gp').style.display=S.t==='yld'?'':'none';
 const o=$('#out');o.innerHTML='';
 if(!sel().length){o.innerHTML='<div class="card mut">請至少選一片 wafer</div>';return}
 ({heat,hist,par,yld})[S.t](o);
}
const col=t=>`hsl(${240-240*Math.max(0,Math.min(1,t))} 75% 50%)`,BC=['#16a34a','#999','#999','#f59e0b','#dc2626','#9333ea','#0891b2','#db2777','#65a30a','#ea580c','#2563eb','#7c3aed'];
function heat(o){
 const ws=sel(),j=S.item,bin=j<0,all=[];let X=[1e9,-1e9],Y=[1e9,-1e9];
 W.forEach(w=>w.rows.forEach(r=>{X=[Math.min(X[0],r.x),Math.max(X[1],r.x)];Y=[Math.min(Y[0],r.y),Math.max(Y[1],r.y)]}));
 ws.forEach(w=>w.rows.forEach(r=>{if(!bin&&isFinite(r.v[j]))all.push(r.v[j])}));
 let a=bin?0:q(all,.01),b=bin?1:q(all,.99);if(a===b)b=a+1;
 const nx=X[1]-X[0]+1,ny=Y[1]-Y[0]+1,c=Math.max(2,Math.floor(400/ny));
 o.innerHTML=`<div class="card mut">${bin?'顏色 = Bin# (綠=Bin1 良品)':`顏色範圍取 1%~99% 分位：${fmt(a)} <span class="leg" style="display:inline-block;vertical-align:middle"></span> ${fmt(b)}；<b>黑框</b>= 超出上下限，灰 = 未測`}　滑鼠移到 die 上可看座標與數值</div><div class="grid"></div>`;
 ws.forEach(w=>{
  const cv=document.createElement('canvas');cv.width=nx*c;cv.height=ny*c;const g=cv.getContext('2d'),m={};
  g.fillStyle='rgba(128,128,128,.12)';g.fillRect(0,0,cv.width,cv.height);
  let p=0;w.rows.forEach(r=>{const v=r.v[j],px=(r.x-X[0])*c,py=(r.y-Y[0])*c,s=c>=5?c-1:c;if(r.bin===1)p++;
   g.fillStyle=bin?BC[r.bin%BC.length]:isFinite(v)?col((v-a)/(b-a)):'#999';g.fillRect(px,py,s,s);
   if(!bin&&(v>w.up[j]||v<w.lo[j])){g.strokeStyle='#000';g.lineWidth=1.5;g.strokeRect(px+.5,py+.5,s-1,s-1)}
   m[r.x+','+r.y]=r});
  cv.onmousemove=e=>{const R=cv.getBoundingClientRect(),k=cv.width/R.width,x=Math.floor((e.clientX-R.left)*k/c)+X[0],y=Math.floor((e.clientY-R.top)*k/c)+Y[0],r=m[x+','+y];
   cv.title=r?`X=${x} Y=${y} Bin=${r.bin}\n`+(bin?'':w.names[j]+' = '+(isFinite(r.v[j])?r.v[j]:'未測')):''};
  const d=document.createElement('div');d.className='card';d.innerHTML=`<button class="png" data-n="heatmap_${esc(bin?'Bin':W[0].names[j])}_${esc(w.id)}" data-t="${esc(w.id)} | ${esc(bin?'Bin Map':W[0].names[j])}" data-s="${bin?'Bin Map (綠=Bin1)':'色階 '+fmt(a)+' ~ '+fmt(b)+'（黑框=超規，灰=未測）'}">⬇ PNG</button><b>${esc(w.id)}</b> <span class="mut">良率 ${(100*p/w.rows.length).toFixed(2)}% (${p}/${w.rows.length})</span>`;d.appendChild(cv);o.querySelector('.grid').appendChild(d)});
}
function stats(d){const n=d.length,m=d.reduce((s,v)=>s+v,0)/n,sd=Math.sqrt(d.reduce((s,v)=>s+(v-m)**2,0)/Math.max(1,n-1));return{n,m,sd,mn:Math.min(...d),mx:Math.max(...d)}}
function hist(o){
 const j=S.item,ws=sel(),d=[];ws.forEach(w=>w.rows.forEach(r=>{if(isFinite(r.v[j]))d.push(r.v[j])}));
 if(!d.length){o.innerHTML='<div class="card mut">此測項無資料</div>';return}
 const U=lim(W[0].up[j]),Lw=lim(W[0].lo[j]);let a=q(d,.005),b=q(d,.995);const sp=(b-a)||Math.abs(a)*.1||1;
 if(Lw!==null&&Lw>=a-3*sp)a=Math.min(a,Lw);if(U!==null&&U<=b+3*sp)b=Math.max(b,U);
 const pad=(b-a)*.04;a-=pad;b+=pad;
 const dv=d.filter(v=>v>=a&&v<=b),N=40,bw=(b-a)/N,cn=Array(N).fill(0);dv.forEach(v=>cn[Math.min(N-1,Math.floor((v-a)/bw))]++);
 const st=stats(dv),dens=$('#hm').value==='d',ys=cn.map(c=>dens?c/(dv.length*bw):c),
  pdf=x=>Math.exp(-.5*((x-st.m)/st.sd)**2)/(st.sd*Math.sqrt(2*Math.PI))*(dens?1:dv.length*bw);
 const ym=Math.max(...ys,st.sd>0?pdf(st.m):0)*1.1,Wd=760,H=360,l=64,r=16,t=16,bt=44,sx=x=>l+(x-a)/(b-a)*(Wd-l-r),sy=y=>H-bt-y/ym*(H-bt-t);
 let s=`<svg viewBox="0 0 ${Wd} ${H}">`;
 for(let k=0;k<=5;k++){const y=ym*k/5,x=a+(b-a)*k/5;s+=`<line x1="${l}" x2="${Wd-r}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--bd)"/><text x="${l-6}" y="${sy(y)+4}" text-anchor="end">${fmt(y)}</text><text x="${sx(x)}" y="${H-bt+16}" text-anchor="middle">${fmt(x)}</text>`}
 cn.forEach((c,k)=>{const x0=a+k*bw,mid=x0+bw/2,bad=(U!==null&&mid>U)||(Lw!==null&&mid<Lw);
  s+=`<rect class="${bad?'bad':'bar'}" x="${sx(x0)+.5}" y="${sy(ys[k])}" width="${Math.max(1,sx(x0+bw)-sx(x0)-1)}" height="${sy(0)-sy(ys[k])}"><title>${fmt(x0)} ~ ${fmt(x0+bw)}: ${c}</title></rect>`});
 if(st.sd>0){let pth='';for(let k=0;k<=120;k++){const x=a+(b-a)*k/120;pth+=(k?'L':'M')+sx(x)+','+sy(pdf(x))}s+=`<path d="${pth}" fill="none" stroke="var(--ln)" stroke-width="2"/>`}
 const vl=(v,n,cl)=>v!==null&&v>=a&&v<=b?`<line x1="${sx(v)}" x2="${sx(v)}" y1="${t}" y2="${H-bt}" stroke="${cl}" stroke-width="2" stroke-dasharray="6 4"/><text x="${sx(v)+3}" y="${t+10}" style="fill:${cl}">${n} ${fmt(v)}</text>`:'';
 s+=vl(Lw,'LSL','var(--bad)')+vl(U,'USL','var(--bad)')+vl(st.m,'μ','var(--good)')+`<text x="${(l+Wd-r)/2}" y="${H-4}" text-anchor="middle">${esc(W[0].names[j])}　(${dens?'機率密度':'次數'}；橘線 = 常態擬合)</text></svg>`;
 const fails=d.filter(v=>(U!==null&&v>U)||(Lw!==null&&v<Lw)).length,cp=U!==null&&Lw!==null?(U-Lw)/(6*st.sd):null,
  cpk=Math.min(U!==null?(U-st.m)/(3*st.sd):1e9,Lw!==null?(st.m-Lw)/(3*st.sd):1e9),hid=d.length-dv.length;
 const rows=ws.map(w=>{const x=w.rows.map(r=>r.v[j]).filter(v=>isFinite(v)),z=x.filter(v=>v>=a&&v<=b),u=z.length?stats(z):null,f=x.filter(v=>(U!==null&&v>U)||(Lw!==null&&v<Lw)).length;
  return`<tr><td>${esc(w.id)}</td><td>${x.length}</td><td>${u?fmt(u.m):'-'}</td><td>${u?fmt(u.sd):'-'}</td><td>${f}</td></tr>`}).join('');
 o.innerHTML=`<div class="card sc"><button class="png" data-n="hist_${esc(W[0].names[j])}" data-t="${esc(W[0].names[j])} 分布" data-s="已選 ${ws.length} 片，n=${st.n}">⬇ PNG</button>${s}</div><div class="card sc"><table><tr><th>統計（顯示範圍內）</th><th>n</th><th>μ</th><th>σ</th><th>Min</th><th>Max</th><th>LSL</th><th>USL</th><th>Cp</th><th>Cpk</th><th>超規數</th></tr>
 <tr><td>已選 ${ws.length} 片合計</td><td>${st.n}</td><td>${fmt(st.m)}</td><td>${fmt(st.sd)}</td><td>${fmt(st.mn)}</td><td>${fmt(st.mx)}</td><td>${Lw??'無'}</td><td>${U??'無'}</td><td>${cp===null?'-':cp.toFixed(2)}</td><td>${cpk>1e8?'-':cpk.toFixed(2)}</td><td>${fails}</td></tr></table>
 <div class="mut" style="margin-top:6px">±99.999 視為「未設限」；${hid?`有 ${hid} 筆極端值（如 overflow=100）超出圖面範圍，未畫入但已計入超規數。`:''}紅柱 = 落在規格外。</div></div>
 <div class="card sc"><table><tr><th>Wafer</th><th>n</th><th>μ</th><th>σ</th><th>超規數</th></tr>${rows}</table></div>`;
}
function par(o){
 const ws=sel(),n=W[0].names.length,c=Array(n).fill(0);let tot=0;
 ws.forEach(w=>w.rows.forEach(r=>{tot++;for(let j=0;j<n;j++){const v=r.v[j];if(v>w.up[j]||v<w.lo[j])c[j]++}}));
 const it=c.map((v,j)=>({v,j})).filter(x=>x.v>0).sort((x,y)=>y.v-x.v),F=it.reduce((s,x)=>s+x.v,0);
 if(!F){o.innerHTML=`<div class="card mut">已選 wafer（${tot} 顆 die）沒有任何測項超規 🎉</div>`;return}
 let cum=0;it.forEach(x=>{cum+=x.v;x.c=cum/F*100});
 const Wd=Math.max(760,it.length*70+120),H=440,l=60,r=56,t=20,bt=140,pw=Wd-l-r,sy=y=>H-bt-y/(it[0].v*1.1)*(H-bt-t),sp=p=>H-bt-p/100*(H-bt-t),bwid=pw/it.length;
 let s=`<svg viewBox="0 0 ${Wd} ${H}" style="min-width:${Math.min(Wd,900)}px">`;
 for(let k=0;k<=5;k++){const y=it[0].v*1.1*k/5;s+=`<line x1="${l}" x2="${Wd-r}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--bd)"/><text x="${l-6}" y="${sy(y)+4}" text-anchor="end">${Math.round(y)}</text><text x="${Wd-r+6}" y="${sp(k*20)+4}">${k*20}%</text>`}
 s+=`<line x1="${l}" x2="${Wd-r}" y1="${sp(80)}" y2="${sp(80)}" stroke="var(--ln)" stroke-dasharray="5 4"/>`;
 let pth='';it.forEach((x,k)=>{const cx=l+bwid*(k+.5);
  s+=`<rect class="${k===0?'bad':'bar'}" x="${cx-bwid*.36}" y="${sy(x.v)}" width="${bwid*.72}" height="${sy(0)-sy(x.v)}"/><text x="${cx}" y="${sy(x.v)-4}" text-anchor="middle">${x.v}</text>
  <text transform="translate(${cx},${H-bt+12}) rotate(-40)" text-anchor="end">${esc(W[0].names[x.j])}</text>`;pth+=(k?'L':'M')+cx+','+sp(x.c);});
 s+=`<path d="${pth}" fill="none" stroke="var(--ln)" stroke-width="2"/>`+it.map((x,k)=>`<circle cx="${l+bwid*(k+.5)}" cy="${sp(x.c)}" r="3" fill="var(--ln)"/>`).join('')+'</svg>';
 o.innerHTML=`<div class="card sc"><button class="png" data-n="pareto_fail" data-t="所有測項 Fail 柏拉圖" data-s="已選 ${ws.length} 片，${tot} 顆 die，超規 ${F} 次">⬇ PNG</button><b>所有測項 Fail 柏拉圖</b> <span class="mut">已選 ${ws.length} 片，共 ${tot} 顆 die，超規 ${F} 次（${(F/tot*100).toFixed(2)}%）；虛線 = 80%</span>${s}</div>
 <div class="card sc"><table><tr><th>測項</th><th>Fail 數</th><th>占 Fail %</th><th>累積 %</th><th>損失率（/總 die）</th><th>下限</th><th>上限</th></tr>${it.map(x=>`<tr><td>${esc(W[0].names[x.j])}</td><td>${x.v}</td><td>${(x.v/F*100).toFixed(1)}</td><td>${x.c.toFixed(1)}</td><td>${(x.v/tot*100).toFixed(2)}%</td><td>${W[0].lo[x.j]}</td><td>${W[0].up[x.j]}</td></tr>`).join('')}</table>
 <div class="mut" style="margin-top:6px">fail 的 die 會在失敗測項即停止量測，因此每顆 die 只會被記一次（第一個失敗項）。零 fail 的測項未列出。</div></div>`;
}
function yld(o){
 const ws=sel(),g=$('#gp').value,G=new Map();
 ws.forEach(w=>{const k=g==='w'?w.id:g==='l'?(w.lot||'-'):(w.cp||'-'),e=G.get(k)||{k,n:0,p:0,wf:0};e.wf++;e.n+=w.rows.length;e.p+=w.rows.filter(r=>r.bin===1).length;G.set(k,e)});
 const A=[...G.values()].map(e=>({...e,y:100*e.p/e.n,v:g==='w'?e.n:e.wf})),lb=g==='w'?'測試 die 數 (pcs)':'Wafer 數 (pcs)';
 const Wd=Math.max(760,A.length*64+110),l=60,r=20,bw=(Wd-l-r)/A.length,cx=k=>l+bw*(k+.5);
 let y0=Math.max(0,Math.floor(Math.min(...A.map(e=>e.y))-2)),y1=Math.min(100,Math.ceil(Math.max(...A.map(e=>e.y))+1));if(y1-y0<3)y0=Math.max(0,y1-3);
 const sy=y=>240-(y-y0)/(y1-y0)*210,vm=Math.max(...A.map(e=>e.v))*1.15,sb=v=>440-v/vm*140;
 let s=`<svg viewBox="0 0 ${Wd} 560"><text x="${l}" y="14">良率 (%)　Bin1 ÷ 測試 die</text>`;
 for(let k=0;k<=5;k++){const y=y0+(y1-y0)*k/5;s+=`<line x1="${l}" x2="${Wd-r}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--bd)"/><text x="${l-6}" y="${sy(y)+4}" text-anchor="end">${y.toFixed(1)}</text>`}
 s+=`<path d="${A.map((e,k)=>(k?'L':'M')+cx(k)+','+sy(e.y)).join('')}" fill="none" stroke="var(--ac)" stroke-width="2"/>`+A.map((e,k)=>`<circle cx="${cx(k)}" cy="${sy(e.y)}" r="4" fill="var(--ac)"><title>${esc(e.k)}: ${e.y.toFixed(2)}% (${e.p}/${e.n})</title></circle><text x="${cx(k)}" y="${sy(e.y)-9}" text-anchor="middle" style="fill:var(--fg)">${e.y.toFixed(2)}</text>`).join('');
 s+=`<text x="${l}" y="284">${lb}</text><line x1="${l}" x2="${Wd-r}" y1="440" y2="440" stroke="var(--bd)"/>`;
 s+=A.map((e,k)=>`<rect class="bar" x="${cx(k)-bw*.3}" y="${sb(e.v)}" width="${bw*.6}" height="${440-sb(e.v)}"/><text x="${cx(k)}" y="${sb(e.v)-4}" text-anchor="middle" style="fill:var(--fg)">${e.v}</text><text transform="translate(${cx(k)},454) rotate(-40)" text-anchor="end">${esc(e.k)}</text>`).join('')+'</svg>';
 o.innerHTML=`<div class="card sc"><button class="png" data-n="yield_${g}" data-t="良率趨勢　${$('#gp').selectedOptions[0].text}" data-s="上：良率 %　下：${lb}">⬇ PNG</button>${s}</div><div class="card sc"><table><tr><th>${g==='w'?'Wafer':g==='l'?'Lot':'站別'}</th><th>Wafer 數 (pcs)</th><th>測試 die</th><th>Pass</th><th>良率 %</th></tr>${A.map(e=>`<tr><td>${esc(e.k)}</td><td>${e.wf}</td><td>${e.n}</td><td>${e.p}</td><td>${e.y.toFixed(2)}</td></tr>`).join('')}</table></div>`;
}
async function exp(btn,ret){
 const el=btn.closest('.card').querySelector('svg,canvas'),cs=getComputedStyle(document.documentElement),bg=cs.getPropertyValue('--card').trim()||'#fff',fg=cs.getPropertyValue('--fg').trim()||'#000',mu=cs.getPropertyValue('--mut').trim()||'#666',P=16,T=btn.dataset.t,Sb=btn.dataset.s,hh=(T?26:0)+(Sb?20:0),isS=el instanceof SVGElement;
 let img,w,h,sc=isS?2:3;
 if(isS){const vb=el.viewBox.baseVal;w=vb.width;h=vb.height;
  const cl=el.cloneNode(true),oa=[el,...el.querySelectorAll('*')],ca=[cl,...cl.querySelectorAll('*')];
  oa.forEach((o,i)=>{const c=getComputedStyle(o);['fill','stroke','stroke-width','stroke-dasharray','font-size','font-family','text-anchor'].forEach(p=>ca[i].style.setProperty(p,c.getPropertyValue(p)))});
  cl.removeAttribute('style');cl.setAttribute('xmlns','http://www.w3.org/2000/svg');cl.setAttribute('width',w);cl.setAttribute('height',h);
  img=new Image();await new Promise((ok,er)=>{img.onload=ok;img.onerror=er;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(cl))})}
 else{img=el;w=el.width;h=el.height}
 const ow=Math.max(w,isS?0:420),o=document.createElement('canvas');o.width=(ow+2*P)*sc;o.height=(h+2*P+hh)*sc;
 const g=o.getContext('2d');g.scale(sc,sc);g.fillStyle=bg;g.fillRect(0,0,o.width,o.height);
 g.fillStyle=fg;g.font='bold 16px system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif';if(T)g.fillText(T,P,P+16);
 g.fillStyle=mu;g.font='12px system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif';if(Sb)g.fillText(Sb,P,P+(T?38:14));
 g.imageSmoothingEnabled=isS;g.drawImage(img,P,P+hh,w,h);
 if(ret)return o;
 await new Promise(ok=>o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(btn.dataset.n||'chart').replace(/[\\/:*?"<>|\s]+/g,'_')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);ok()}));
}
$('#out').addEventListener('click',e=>{const b=e.target.closest('.png');if(b)exp(b).catch(()=>alert('PNG 匯出失敗'))});
$('#all').onclick=async()=>{
 const bs=[...document.querySelectorAll('#out .png')];if(!bs.length)return;
 const cs=[];for(const b of bs)cs.push(await exp(b,true));
 const cols=S.t==='heat'?Math.min(cs.length,4):1,gap=24,cw=Math.max(...cs.map(c=>c.width)),ch=Math.max(...cs.map(c=>c.height)),rows=Math.ceil(cs.length/cols),
  o=document.createElement('canvas'),bg=getComputedStyle(document.documentElement).getPropertyValue('--card').trim()||'#fff';
 o.width=cols*cw+(cols+1)*gap;o.height=rows*ch+(rows+1)*gap;
 const g=o.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,o.width,o.height);
 cs.forEach((c,i)=>g.drawImage(c,gap+(i%cols)*(cw+gap),gap+Math.floor(i/cols)*(ch+gap)));
 o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(S.t+'_'+(S.t==='par'||S.t==='yld'?'':$('#item').selectedOptions[0].text+'_')+'all.png').replace(/[\\/:*?"<>|\s]+/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)});
};

document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.t=b.dataset.t;ui()});
